const places=[{id:'hq',name:'Garden HQ · Mexico',x:22,y:43},{id:'costa',name:'Costa Rica · Rainforest',x:28,y:53},{id:'england',name:'England · Woodland',x:48,y:27},{id:'florida',name:'Florida, USA · Mangroves',x:30,y:42},{id:'egypt',name:'Egypt · Desert',x:56,y:43},{id:'iceland',name:'Iceland · Tundra',x:43,y:19},{id:'australia',name:'Australia · Dry interior',x:83,y:72},{id:'alps',name:'Alps · Mountain meadow',x:52,y:31},{id:'antarctica',name:'Antarctica · Ice',x:52,y:91}];
const stops=[
{place:'hq',title:'The missing habitat labels',subtitle:'CASE 01 / GARDEN HQ',intro:'Bob borrowed our habitat scanner to build a garden on his spaceship. Now the labels are mixed up—and Bob has vanished. Follow his trail before he builds a garden that cannot grow.',witness:'“He asked where trees stay green in warm, wet conditions. His ticket named a country between Nicaragua and Panama.” — The gardener',field:'Three logs were left on the desk: warm weather throughout the year, frequent rain, and layers of leafy trees. These describe the rainforest stop on his route.',scan:'The scanner shows Bob labelled sunlight “plant material”. Repair his labels to unlock the flight recorder.',next:'costa',choices:['egypt','costa','iceland'],puzzle:'sort',name:'Repair the plant-input labels',hint:'Matter is the stuff plants are made of. Light supplies energy. Most new plant material comes from air and water; soil supplies smaller amounts of minerals.'},
{place:'costa',title:'A trail under the leaves',subtitle:'COSTA RICA / RAINFOREST',intro:'Bob’s scanner is wedged beneath a giant leaf. Its memory holds a woodland photograph, but the matter-transfer arrows are missing.',witness:'“He wanted to see fallen leaves beneath oak trees. His next ticket said England. He packed a raincoat, but no polar equipment.” — The field researcher',field:'His next photograph shows a temperate woodland: oak leaves, fungi on fallen wood and a cool-season leaf carpet. Habitats vary within countries; the named stop is a woodland.',scan:'The scanner says dead leaves disappear forever. Restore the matter pathways to recover the next map coordinate.',next:'england',choices:['australia','england','antarctica'],puzzle:'paths',name:'Restore the matter pathways',hint:'Dead material is broken down by decomposers. Materials return to the surroundings. Plants take in water, air and small amounts of soil minerals. Matter does not simply vanish.'},
{place:'england',title:'The borrowed sunshine',subtitle:'ENGLAND / WOODLAND',intro:'A tiny silver bootprint leads to a broken energy recorder. Bob has confused matter that can cycle with energy transferred through food.',witness:'“He booked a flight to Florida in the USA. He asked for a coastal forest with tangled roots in tidal water.” — The woodland ranger',field:'A postcard shows young fish sheltering among mangrove roots. Its caption says Everglades, Florida. At this coast, fresh water meets salty water.',scan:'Bob’s recorder sends food energy back to the Sun. Build the correct direction of energy transfer to reveal his landing site.',next:'florida',choices:['alps','florida','egypt'],puzzle:'energy',name:'Trace food energy',hint:'Start with the Sun. Plants use light energy to make food. Feeding transfers some energy to animals. Energy does not cycle back to the Sun.'},
{place:'florida',title:'Bob’s garden rescue',subtitle:'FLORIDA / MANGROVES',intro:'There he is! Bob has landed beside a mangrove boardwalk. He has only scanned the organisms—nothing has been taken from the wild. Help him fix his spaceship garden.',witness:'“I thought plants ate soil and dead leaves became nothing,” Bob admits. “Can you help me correct my garden plan?”',field:'The mangrove’s roots provide shelter for small fish. This habitat depends on both living things and physical conditions. Your spaceship garden is a simplified model, not a replacement ecosystem.',scan:'Three faults remain: the plant inputs, the dead-leaf pathway and the food-energy arrow. Repair all three to close the case.',puzzle:'repair',name:'Repair Bob’s habitat plan',hint:'Use your evidence: air and water supply most plant material; decomposers return materials to the surroundings; food energy starts with sunlight.'}

function newCase(){return {step:0,read:{},solved:{},sort:{},links:{},chain:[],repair:{},travel:null,notes:'',wrong:0,complete:false};}
function required(colour){return colour<2?2:3;}
function puzzleCount(colour){return [3,4,5,6][colour];}
function pathCount(colour){return [3,4,5,6][colour];}
function expectedChain(colour){return colour<2?['Sun','Grass','Rabbit']:['Sun','Grass','Grasshopper','Bird'];}
function checkPuzzle(s,c){if(s.step===0)return sortCards.slice(0,puzzleCount(c)).every(x=>s.sort[x.id]===x.category);if(s.step===1)return paths.slice(0,pathCount(c)).every((x,i)=>s.links[i]===x.to);if(s.step===2)return JSON.stringify(s.chain)===JSON.stringify(expectedChain(c));return repairs.every((x,i)=>s.repair[i]===x.answer);}
function canTravel(s,c){return !!s.solved[s.step]&&(s.read[s.step]||[]).length>=required(c);}
function chooseDestination(s,c,id){if(!canTravel(s,c))return 'locked';if(stops[s.step].next!==id){s.wrong++;return 'wrong';}s.step++;s.travel=null;return 'arrived';}

return `<svg viewBox="0 0 640 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrated ${['school garden','rainforest','woodland','mangrove shore'][n]} scene"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#9fbdab"/><stop offset="1" stop-color="#d9d8ae"/></linearGradient></defs><rect width="640" height="300" fill="url(#sky)"/><circle cx="480" cy="64" r="32" fill="#eee0a4" opacity=".7"/>${scene}<path d="M0 298H640" stroke="#b4c38e" stroke-width="4"/></svg><div class="scene-label">${found?'BOB LOCATED':'FIELD VIEW '+String(n+1).padStart(2,'0')} · ILLUSTRATED SCENE</div>`;}

function feedback(message,error=false){$('#feedback').textContent=message;$('#feedback').className=error?'error':'';}
function dialog(title,body){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;$('#dialog').showModal();}$('#close').onclick=()=>$('#dialog').close();$('#dialog').onclick=e=>{if(e.target===$('#dialog'))$('#dialog').close();};
function render(){const c=state.colour,d=s(),n=d.step;$('#colours').innerHTML=colours.map((x,i)=>`<button style="--c:${['#e57479','#e3a052','#95cb7d','#7cb5e3'][i]}" data-colour="${i}" aria-pressed="${c===i}">${x}</button>`).join('');document.querySelectorAll('[data-colour]').forEach(b=>b.onclick=()=>{state.colour=+b.dataset.colour;tab='puzzle';render();feedback('Your '+colours[state.colour]+' case is open.');});$('#location').textContent=stop().subtitle;$('#progress').textContent=d.complete?'CASE CLOSED':`STOP ${n+1} / 4`;$('#title').textContent=stop().title;$('#intro').textContent=stop().intro;$('#scene').innerHTML=landscape(n,n===3);$('#direction').textContent=evidencePrompt[c];$('#clues').innerHTML=[['witness','◉','Interview'],['field','⌕','Field notes'],['scan','▣','Scan evidence']].map(([id,icon,label])=>`<button data-clue="${id}" class="${(d.read[n]||[]).includes(id)?'read':''}"><span>${icon}</span>${label}${(d.read[n]||[]).includes(id)?' ✓':''}</button>`).join('');document.querySelectorAll('[data-clue]').forEach(b=>b.onclick=()=>{const id=b.dataset.clue;d.read[n]||=[];if(!d.read[n].includes(id))d.read[n].push(id);save();render();dialog({witness:'Witness statement',field:'Field notes',scan:'Scanner evidence'}[id],`<p class="clue-tag">${escape(places.find(p=>p.id===stop().place).name)}</p><p>${escape(stop()[id])}</p>${c===0?'<p><strong>Detective tip:</strong> say the important words aloud with a partner.</p>':c===3?'<p><strong>Evidence check:</strong> which detail identifies the place, and which explains the ecosystem?</p>':''}<p>This clue is saved in your notebook.</p>`);});$('#puzzleTab').setAttribute('aria-pressed',String(tab==='puzzle'));$('#mapTab').setAttribute('aria-pressed',String(tab==='map'));tab==='map'?renderMap():renderPuzzle();save();}
function renderPuzzle(){const d=s(),c=state.colour,n=d.step;if(d.complete){$('#content').innerHTML=`<span class="stamp">CASE CLOSED · BOB FOUND</span><h2>You repaired the habitat plan.</h2><div class="success-card"><strong>“Earth makes more sense now!”</strong><p>Bob will use air, water and light correctly, return materials through decomposition, and trace food energy from the Sun.</p></div><p>Tell your teacher: what can cycle in an ecosystem, and what does not cycle back to the Sun?</p><label for="reflection">Your evidence-based explanation</label><textarea id="reflection" style="width:100%;min-height:100px;margin-top:10px;padding:12px">${escape(d.notes)}</textarea><button id="export" class="primary">Download case notebook</button><p>Your teacher reviews your explanation. Completing this case is practice, not a full assessment.</p>`;$('#reflection').oninput=e=>{d.notes=e.target.value;save();};$('#export').onclick=download;return;}
let html=`<h2>${stop().name}</h2><p>${['Sort the scanner cards into material or energy.','Complete the labelled arrows. Each arrow must say where matter moves.','Tap the cards in order to build a food-energy chain.','Use what you learned to fix all three faults.'][n]}</p>`;
if(n===0)html+=sortCards.slice(0,puzzleCount(c)).map(x=>`<div class="sort-row"><span>${escape(c===0?{air:'Air',water:'Water',light:'Sunlight'}[x.id]||x.text:x.text)}</span><div>${['material','energy'].map(k=>`<button data-sort="${x.id}" data-value="${k}" class="${d.sort[x.id]===k?'selected':''}" aria-pressed="${d.sort[x.id]===k}" aria-label="${x.text}: ${k}">${k==='material'?'Material':'Energy'}</button>`).join('')}</div></div>`).join('');
if(n===1){const options=['Plant','Sun','Surroundings','Herbivore','Decomposers','Nothing remains'];html+=paths.slice(0,pathCount(c)).map((x,i)=>`<div class="path-row"><label for="path${i}">${i+1}. ${escape(x.from)} →</label><select id="path${i}" data-path="${i}"><option value="">Choose a destination</option>${options.filter(o=>c>0||[x.to,'Sun','Nothing remains'].includes(o)).map(o=>`<option ${d.links[i]===o?'selected':''}>${o}</option>`).join('')}</select><small>${escape(x.label)}</small></div>`).join('');}
if(n===2){const target=expectedChain(c),bank=c<2?['Rabbit','Sun','Soil','Grass']:['Bird','Soil','Sun','Grasshopper','Grass','Decomposers'];html+=`<div class="chain" aria-label="Your energy chain">${d.chain.length?d.chain.map((x,i)=>`${i?'<i>→</i>':''}<span>${x}</span>`).join(''):'Tap the starting energy source.'}</div><p>Build ${target.length} cards in order. Arrows mean energy is transferred.</p><div class="bank">${bank.map(x=>`<button data-energy="${x}">${x}</button>`).join('')}</div><div class="tools"><button id="undo">Undo card</button><button id="clearChain">Clear chain</button></div>`;}
if(n===3)html+=repairs.map((x,i)=>`<div class="repair-item"><p>${i+1}. ${escape(x.q)}</p>${x.options.map((o,j)=>`<button data-repair="${i}" data-value="${j}" class="${d.repair[i]===j?'selected':''}" aria-pressed="${d.repair[i]===j}">${escape(o)}</button>`).join('')}</div>`).join('');
html+=`<div class="tools"><button id="hint">Show a hint</button><span style="font-size:10px;align-self:center">${(d.read[n]||[]).length} / ${required(c)} clues needed</span></div><button id="check" class="primary">${d.solved[n]?'Check repaired scanner':'Check science model'}</button>${d.solved[n]&&n<3?'<button id="goMap" class="primary">Follow the travel clues →</button>':''}`;$('#content').innerHTML=html;
document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{d.sort[b.dataset.sort]=b.dataset.value;save();renderPuzzle();});document.querySelectorAll('[data-path]').forEach(el=>el.onchange=()=>{d.links[el.dataset.path]=el.value;save();});document.querySelectorAll('[data-energy]').forEach(b=>b.onclick=()=>{if(d.chain.length>=expectedChain(c).length){feedback('Your chain is full. Undo or clear it to change a card.',true);return;}d.chain.push(b.dataset.energy);save();renderPuzzle();});if($('#undo'))$('#undo').onclick=()=>{d.chain.pop();save();renderPuzzle();};if($('#clearChain'))$('#clearChain').onclick=()=>{d.chain=[];save();renderPuzzle();};document.querySelectorAll('[data-repair]').forEach(b=>b.onclick=()=>{d.repair[b.dataset.repair]=+b.dataset.value;save();renderPuzzle();});$('#hint').onclick=()=>dialog('Scanner hint',`<p>${escape(stop().hint)}</p>`);$('#check').onclick=()=>{if((d.read[n]||[]).length<required(c)){feedback(`Collect at least ${required(c)} scene clues first. Use Interview, Field notes or Scan evidence.`,true);return;}if(!checkPuzzle(d,c)){feedback(['Check the labels: material is stuff; sunlight supplies energy. Air and water are materials.','Check the arrows. Decomposers break down dead material and return materials to the surroundings.','Begin with sunlight, then the plant, then an animal that eats it. Soil is not the original food-energy source.','One or more repairs need another look. Use the evidence in your notebook.'][n],true);return;}d.solved[n]=true;if(n===3)d.complete=true;save();render();feedback(n===3?'Case closed! Bob’s habitat plan is repaired.':'Scanner repaired. Now combine the witness and habitat clues to choose your next destination.');};if($('#goMap'))$('#goMap').onclick=()=>{tab='map';render();};}
function mapSvg(){const current=stop().place,visited=stops.slice(0,s().step+1).map(x=>places.find(p=>p.id===x.place));return `<div class="map"><svg viewBox="0 0 600 320" role="img" aria-label="Schematic world route map"><rect width="600" height="320" fill="#c9d9d4"/><path d="M48 53L83 27L163 28L205 63L177 106L155 130L171 162L145 181L128 142L90 124L68 83ZM179 168L224 182L245 228L210 289L184 247L166 201ZM282 76L311 50L348 60L374 40L448 44L530 92L499 145L448 132L428 181L389 147L366 109L339 117L359 174L330 232L301 201L282 143L291 105ZM466 217L506 209L543 241L524 263L482 259ZM72 304L210 292L350 299L493 289L566 312H72Z" fill="#95ae89"/><path d="${visited.map((p,i)=>`${i?'L':'M'}${p.x*6} ${p.y*3.2}`).join(' ')}" stroke="#9c633f" stroke-width="2" stroke-dasharray="5 4" fill="none"/>${places.filter(p=>p.id===current||(stop().choices||[]).includes(p.id)||visited.includes(p)).map(p=>`<g><circle cx="${p.x*6}" cy="${p.y*3.2}" r="${p.id===current?7:5}" fill="${p.id===current?'#274e4b':'#a2693f'}"/><text x="${p.x*6+9}" y="${p.y*3.2-7}" font-size="10" fill="#1b393d">${p.name.split(' · ')[0].replace('Garden HQ · ','')}</text></g>`).join('')}</svg></div>`;}
function renderMap(){const d=s(),n=d.step;$('#content').innerHTML=`<h2>${n===3?'Bob’s landing site':'Where did Bob go next?'}</h2>${mapSvg()}<p class="maplegend">Schematic route map. Coastlines and marker positions are simplified.</p>${n===3?'<p>You have reached Bob. Return to the scanner to repair his habitat plan.</p><button id="backPuzzle" class="primary">Repair Bob’s plan</button>':`<p>${canTravel(d,state.colour)?'Use the country and habitat clues together. A wrong lead gives feedback; you can try again.':'Collect the scene clues and repair the science scanner to unlock travel.'}</p><div class="destinations">${stop().choices.map(id=>`<button data-destination="${id}" ${canTravel(d,state.colour)?'':'disabled'}>${escape(places.find(p=>p.id===id).name)}</button>`).join('')}</div>`}`;document.querySelectorAll('[data-destination]').forEach(b=>b.onclick=()=>{const result=chooseDestination(d,state.colour,b.dataset.destination);save();if(result==='wrong'){feedback('That lead does not fit both the witness’s country clue and the habitat evidence. Reopen your notebook and compare them.',true);}else if(result==='arrived'){tab='puzzle';render();feedback('Flight complete. Investigate this new location for Bob’s next clue.');}});if($('#backPuzzle'))$('#backPuzzle').onclick=()=>{tab='puzzle';render();};}
$('#puzzleTab').onclick=()=>{tab='puzzle';render();};$('#mapTab').onclick=()=>{tab='map';render();};$('#notebook').onclick=()=>{const d=s();dialog('Your case notebook',`<p class="clue-tag">${colours[state.colour]} / ${d.complete?'CASE CLOSED':'CASE IN PROGRESS'}</p>${stops.map((x,i)=>(d.read[i]||[]).map(k=>`<div class="notebook-entry"><strong>${escape(places.find(p=>p.id===x.place).name)} · ${k}</strong><p>${escape(x[k])}</p></div>`).join('')).join('')||'<p>No evidence collected yet. Interview a witness or inspect the scene.</p>'}<label for="notes">Your reasoning: which evidence matters?</label><textarea id="notes">${escape(d.notes)}</textarea><button id="download">Download notebook</button>`);$('#notes').oninput=e=>{d.notes=e.target.value;save();};$('#download').onclick=download;};
function download(){const d=s(),text=['WHERE IN THE WORLD IS BOB THE ALIEN?','Case 1: The Mixed-Up Habitat',colours[state.colour],d.complete?'Case closed':'Stop '+(d.step+1),'',...stops.flatMap((x,i)=>(d.read[i]||[]).map(k=>`${places.find(p=>p.id===x.place).name} — ${k}\n${x[k]}\n`)),'Science checkpoints: '+Object.keys(d.solved).length+'/4','Wrong travel leads tried: '+d.wrong,'My explanation: '+d.notes,'Teacher review: completion and selected models do not alone establish mastery.'].join('\n'),url=URL.createObjectURL(new Blob([text],{type:'text/plain'})),a=document.createElement('a');a.href=url;a.download='Bob_Case_1_Notebook.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('#help').onclick=()=>dialog('Become an ecosystem detective',`<ol><li>Choose your colour. Each colour saves a separate case.</li><li>Interview the witness, inspect field notes and scan evidence.</li><li>Repair the science scanner using the clues.</li><li>Open the travel map and choose a destination using both country and habitat evidence.</li><li>Find Bob, fix his garden plan and explain your reasoning.</li></ol><p>No timer, no lives lost. Hints and your notebook are always available. All characters, conversations and travel events are fictional. Ecosystem explanations are based on science.</p><p>No login or student name is needed. Progress stays on this browser and device. Download your notebook before clearing or sharing the device.</p>`);$('#restart').onclick=()=>{dialog('Restart this colour?',`<p>This clears the ${colours[state.colour]} case on this device. Download its notebook first if you want to keep it. Other colours are unchanged.</p><button id="confirmRestart">Restart ${colours[state.colour]}</button>`);$('#confirmRestart').onclick=()=>{state.cases[state.colour]=newCase();tab='puzzle';save();$('#dialog').close();render();feedback('New case opened. Begin with the scene clues.');};};render();
</script></body></html>
